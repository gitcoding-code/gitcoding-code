<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Marketfield</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #241407;
      font-family: Arial, Helvetica, sans-serif;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #241407;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #241407;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(20, 10, 4, 0.82), rgba(20, 10, 4, 0.9)),
        #241407;
      color: #f6d28b;
      text-align: center;
      z-index: 10;
    }

    #loading-panel {
      width: min(420px, calc(100vw - 48px));
      padding: 24px;
      border: 3px solid #7a4417;
      background: #3b210d;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    #loading-title {
      margin: 0 0 8px;
      color: #f0a33a;
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
    }

    #loading-subtitle {
      margin: 0 0 18px;
      color: #f6d28b;
      font-size: 14px;
      line-height: 1.4;
    }

    #progress-frame {
      width: 100%;
      height: 20px;
      border: 2px solid #120904;
      background: #1a0d05;
      overflow: hidden;
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2eca45, #ffd84e);
      transition: width 0.12s ease-out;
    }

    #progress-text {
      margin-top: 10px;
      color: #fff0bd;
      font-size: 13px;
    }

    #loading-hint {
      margin-top: 16px;
      color: #c89b61;
      font-size: 12px;
      line-height: 1.35;
    }

    #unity-warning {
      position: fixed;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      z-index: 20;
      max-width: min(640px, calc(100vw - 32px));
    }

    #unity-warning div {
      margin-bottom: 8px;
      padding: 10px 14px;
      color: #fff;
      background: #7a1c1c;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loading-screen">
    <div id="loading-panel">
      <h1 id="loading-title">Marketfield</h1>
      <p id="loading-subtitle">Loading game...</p>
      <div id="progress-frame">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-text">0%</div>
      <div id="loading-hint">After an update, the first browser load can take a little longer while the new build is cached.</div>
    </div>
  </div>

  <div id="unity-warning"></div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingScreen = document.querySelector("#loading-screen");
    var progressFill = document.querySelector("#progress-fill");
    var progressText = document.querySelector("#progress-text");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? "block" : "none";
      }

      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type === "warning") {
        div.style.background = "#7a5a1a";
        setTimeout(function() {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WEB.loader.js";
    var config = {
      dataUrl: buildUrl + "/WEB.data",
      frameworkUrl: buildUrl + "/WEB.framework.js",
      codeUrl: buildUrl + "/WEB.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "pollikk_studio",
      productName: "Marketfield",
      productVersion: "0.1.0",
      showBanner: unityShowBanner
    };

    function resizeCanvas() {
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function() {
      createUnityInstance(canvas, config, function(progress) {
        var percent = Math.round(progress * 100);
        progressFill.style.width = percent + "%";
        progressText.textContent = percent + "%";
      }).then(function(unityInstance) {
        loadingScreen.style.display = "none";
      }).catch(function(message) {
        progressText.textContent = "Loading failed";
        unityShowBanner(message, "error");
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
